<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <!-- viewport-fit=cover so the notch does not letterbox us again, and
       user-scalable=no so a two-finger throw never pinch-zooms the page. -->
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Knightfly</title>
  <style>
    /*
      Unity's Default template puts the canvas in a fixed 960x640 box on
      desktop, so the engine never sees the real window and everything is
      letterboxed inside a box inside a page. This template has one rule: the
      canvas IS the viewport, and the engine is told about every resize.
    */
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #16120F;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none; overscroll-behavior: none;
    }
    #unity-canvas {
      display: block; position: fixed; inset: 0;
      width: 100%; height: 100%;
      background: #16120F; outline: none;
    }
    #unity-loading {
      position: fixed; inset: 0; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      background: #16120F; color: #E8D9BE;
      font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: .08em; text-transform: uppercase; gap: 18px;
    }
    #unity-bar { width: min(52vw, 320px); height: 6px; background: #2B231C; border-radius: 3px; overflow: hidden; }
    #unity-bar > i { display: block; height: 100%; width: 0%; background: #E0A128; transition: width .15s linear; }
    #unity-warning { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 9; }
    #unity-warning div { padding: 8px 12px; margin: 4px; border-radius: 4px; font: 13px system-ui; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <div id="unity-loading">
    <div>Knightfly</div>
    <div id="unity-bar"><i id="unity-bar-fill"></i></div>
  </div>
  <div id="unity-warning"></div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#unity-loading");
    var barFill = document.querySelector("#unity-bar-fill");
    var warning = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      var div = document.createElement('div');
      div.innerHTML = msg;
      div.style.background = type == 'error' ? '#7a1f1f' : '#7a6a1f';
      div.style.color = '#fff';
      warning.appendChild(div);
      if (type == 'warning') setTimeout(function () { warning.removeChild(div); }, 5000);
    }

    var config = {
      dataUrl: "Build/WebGL.data.unityweb",
      frameworkUrl: "Build/WebGL.framework.js.unityweb",
      codeUrl: "Build/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Raz Levi",
      productName: "Knightfly",
      productVersion: "0.1.0",
      showBanner: unityShowBanner,
      // The engine must not resize the canvas itself; we own that, and we set
      // it from the visual viewport so iOS Safari's chrome is accounted for.
      matchWebGLToCanvasSize: false,
    };

    // One place decides the size. Called before load, on every resize, and on
    // orientation change - because a phone rotating is the case that broke.
    function fit() {
      var vv = window.visualViewport;
      var w = Math.round((vv ? vv.width : window.innerWidth));
      var h = Math.round((vv ? vv.height : window.innerHeight));
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
    }
    fit();
    window.addEventListener("resize", fit);
    window.addEventListener("orientationchange", function () { setTimeout(fit, 120); });
    if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);

    var script = document.createElement("script");
    script.src = "Build/WebGL.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        barFill.style.width = (100 * progress) + "%";
      }).then(function (instance) {
        window.unityInstance = instance;
        loading.style.display = "none";
        fit();
      }).catch(function (message) {
        unityShowBanner(message, 'error');
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
